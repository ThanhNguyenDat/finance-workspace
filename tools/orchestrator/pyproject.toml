[project]
name = "orchestrator"
version = "0.1.0"
description = "Python implementation of the Finance orchestration state CLIs"
readme = "README.md"
authors = [
    { name = "thanhnd13", email = "thanhnd13@vng.com.vn" }
]
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.151",
  "mcp==2.1.1",
  "openai-codex==0.147.0",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orchestrator"

[project.scripts]
codex-exec = "orchestrator.cli.codex_exec:cli"
claude-exec = "orchestrator.cli.claude_exec:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.0",
    "ty>=0.0.1a20",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
