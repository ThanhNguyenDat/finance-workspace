<title>Agent Transcripts</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #f0eee7;
    --border: #ddd8cc;
    --text: #22201c;
    --text-dim: #726d5f;
    --text-faint: #a39d8c;
    --claude: #b85c3a;
    --claude-bg: #f4e3da;
    --codex: #1f8f7a;
    --codex-bg: #dcf0ea;
    --ok: #3d8a52;
    --warn: #b8862f;
    --bad: #c0492f;
    --focus: #2f6fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --surface: #1b1f27;
      --surface-2: #232837;
      --border: #2b3140;
      --text: #e8e6e0;
      --text-dim: #9a9fac;
      --text-faint: #666c7c;
      --claude: #e08b64;
      --claude-bg: #3a2a22;
      --codex: #5fc9b3;
      --codex-bg: #1c3530;
      --ok: #6bbf82;
      --warn: #d9a75c;
      --bad: #e0725a;
      --focus: #6fa8dc;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c;
    --surface: #1b1f27;
    --surface-2: #232837;
    --border: #2b3140;
    --text: #e8e6e0;
    --text-dim: #9a9fac;
    --text-faint: #666c7c;
    --claude: #e08b64;
    --claude-bg: #3a2a22;
    --codex: #5fc9b3;
    --codex-bg: #1c3530;
    --ok: #6bbf82;
    --warn: #d9a75c;
    --bad: #e0725a;
    --focus: #6fa8dc;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 300px;
    min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  #sidebar-head {
    padding: 18px 18px 12px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-head h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.01em;
  }
  #sidebar-head p {
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  #tree {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .change-group { margin-bottom: 4px; }
  .change-label {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .change-label:hover { background: var(--surface-2); }
  .change-label .caret {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--text-faint);
    width: 10px;
    transition: transform 0.15s;
  }
  .change-label[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .round-list { padding-left: 18px; }
  .round-item { margin-bottom: 2px; }
  .round-label {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .round-label:hover { background: var(--surface-2); }
  .round-label .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--text-faint);
  }
  .attempt-list { padding-left: 14px; }
  .attempt-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    padding: 5px 8px 5px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .attempt-item:hover { background: var(--surface-2); }
  .attempt-item.active {
    background: var(--surface-2);
    border-left-color: var(--focus);
    color: var(--text);
    font-weight: 600;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.claude { background: var(--claude); }
  .dot.codex { background: var(--codex); }

  /* ---------- Main pane ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #attempt-header {
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .provider-pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .provider-pill.claude { background: var(--claude-bg); color: var(--claude); }
  .provider-pill.codex { background: var(--codex-bg); color: var(--codex); }
  #attempt-header h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .meta-row {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .status-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .status-pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .status-pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

  #timeline {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 60px;
  }
  #timeline-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  .bubble {
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 14px;
    max-width: 100%;
  }
  .bubble-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bubble.message { border-left: 3px solid var(--focus); }
  .bubble.message .bubble-tag { color: var(--focus); }
  .bubble.message .bubble-body {
    white-space: pre-wrap;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .bubble.tool_call {
    background: var(--surface-2);
    border-left: 3px solid var(--text-faint);
  }
  .bubble.tool_call .bubble-body {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-x: auto;
    color: var(--text);
  }
  .bubble.tool_result {
    background: var(--surface-2);
    border-left: 3px solid var(--ok);
    opacity: 0.9;
  }
  .bubble.tool_result .bubble-tag { color: var(--ok); }
  .bubble.tool_result .bubble-body {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    white-space: pre-wrap;
    overflow-x: auto;
    color: var(--text-dim);
  }
  .bubble.reasoning {
    background: transparent;
    border-style: dashed;
    cursor: pointer;
  }
  .bubble.reasoning .bubble-tag { color: var(--text-faint); }
  .bubble.reasoning .bubble-body {
    font-size: 12.5px;
    color: var(--text-dim);
    font-style: italic;
    white-space: pre-wrap;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bubble.reasoning.expanded .bubble-body {
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  #empty-state, #loading-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    flex-direction: column;
    gap: 8px;
    text-align: center;
    padding: 40px;
  }
  #empty-state .big, #loading-state .big {
    font-family: "IBM Plex Mono", monospace;
    font-size: 28px;
    color: var(--text-faint);
  }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<div id="sidebar">
  <div id="sidebar-head">
    <h1>Agent Transcripts</h1>
    <p id="sidebar-sub">Loading…</p>
  </div>
  <nav id="tree"></nav>
</div>

<div id="main">
  <div id="loading-state">
    <div class="big">···</div>
    <div>Reading coordinator sessions…</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KIND_LABEL = {
    message: "message",
    reasoning: "reasoning",
    tool_call: "command",
    tool_result: "result"
  };

  var PROVIDER_LABEL = { claude: "Claude", codex: "Codex" };

  var state = { attempts: [], activeId: null };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "class") node.className = attrs[k];
        else if (k === "text") node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      return d.toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return iso; }
  }

  function statusClass(a) {
    if (a.status === "COMPLETED" && a.result_class === "success") return "ok";
    if (a.status === "RUNNING") return "warn";
    return "bad";
  }

  function groupAttempts(attempts) {
    var changes = {};
    attempts.forEach(function (a) {
      var change = a.change || "unknown";
      var round = a.round != null ? String(a.round) : (a.session_id || "").slice(0, 8);
      if (!changes[change]) changes[change] = {};
      if (!changes[change][round]) changes[change][round] = [];
      changes[change][round].push(a);
    });
    return changes;
  }

  function renderTree() {
    var tree = document.getElementById("tree");
    tree.innerHTML = "";
    var grouped = groupAttempts(state.attempts);
    var changeNames = Object.keys(grouped).sort();
    changeNames.forEach(function (change, ci) {
      var group = el("div", { class: "change-group" });
      var roundKeys = Object.keys(grouped[change]).sort(function (a, b) {
        return Number(b) - Number(a) || b.localeCompare(a);
      });
      var totalAttempts = roundKeys.reduce(function (n, r) { return n + grouped[change][r].length; }, 0);
      var caret = el("span", { class: "caret", text: "▾" });
      var label = el("button", { class: "change-label", "aria-expanded": "true" }, [
        caret,
        el("span", { text: change }),
      ]);
      var roundList = el("div", { class: "round-list" });
      label.addEventListener("click", function () {
        var expanded = label.getAttribute("aria-expanded") === "true";
        label.setAttribute("aria-expanded", expanded ? "false" : "true");
        roundList.style.display = expanded ? "none" : "block";
      });

      roundKeys.forEach(function (round) {
        var attempts = grouped[change][round].slice().sort(function (a, b) {
          return (a.attempt_no || 0) - (b.attempt_no || 0);
        });
        var roundItem = el("div", { class: "round-item" });
        var attemptList = el("div", { class: "attempt-list" });
        var rCaret = el("span", { class: "caret", text: "▾" });
        var roundLabel = el("button", { class: "round-label", "aria-expanded": "true" }, [
          el("span", {}, [rCaret, document.createTextNode(" round " + round)]),
          el("span", { class: "count", text: attempts.length }),
        ]);
        roundLabel.addEventListener("click", function () {
          var expanded = roundLabel.getAttribute("aria-expanded") === "true";
          roundLabel.setAttribute("aria-expanded", expanded ? "false" : "true");
          attemptList.style.display = expanded ? "none" : "block";
        });

        attempts.forEach(function (a) {
          var item = el("button", { class: "attempt-item", "data-id": a._id }, [
            el("span", { class: "dot " + a.provider }),
            el("span", {
              text: a.phase + " · a" + a.attempt_no + " · " + PROVIDER_LABEL[a.provider]
            }),
          ]);
          if (a._id === state.activeId) item.classList.add("active");
          item.addEventListener("click", function () { selectAttempt(a._id); });
          attemptList.appendChild(item);
        });

        roundItem.appendChild(roundLabel);
        roundItem.appendChild(attemptList);
        roundList.appendChild(roundItem);
      });

      group.appendChild(label);
      group.appendChild(roundList);
      tree.appendChild(group);
    });
  }

  function bubbleNode(msg) {
    var kind = msg.kind || "message";
    var b = el("div", { class: "bubble " + kind });
    var tag = el("div", { class: "bubble-tag" }, [
      document.createTextNode(kind === "tool_call" ? "$" : (KIND_LABEL[kind] || kind)),
    ]);
    var body = el("div", { class: "bubble-body", text: msg.text || "" });
    b.appendChild(tag);
    b.appendChild(body);
    if (kind === "reasoning") {
      b.addEventListener("click", function () { b.classList.toggle("expanded"); });
    }
    return b;
  }

  function renderAttempt(a) {
    var main = document.getElementById("main");
    main.innerHTML = "";

    var header = el("div", { id: "attempt-header" }, [
      el("span", { class: "provider-pill " + a.provider, text: PROVIDER_LABEL[a.provider] }),
      el("h2", { text: a.change + " — round " + (a.round != null ? a.round : "?") }),
      el("span", { class: "status-pill " + statusClass(a), text: a.status }),
    ]);
    var meta = el("div", { class: "meta-row" }, [
      el("span", { text: "phase " + a.phase }),
      el("span", { text: "attempt " + a.attempt_no }),
      el("span", { text: (a.account || "no account") }),
      el("span", { text: fmtTime(a.started_at) + " → " + fmtTime(a.completed_at) }),
    ]);
    header.appendChild(meta);

    var timeline = el("div", { id: "timeline" });
    var inner = el("div", { id: "timeline-inner" });
    var messages = a.messages || [];
    if (!messages.length) {
      inner.appendChild(el("div", {
        style: "color:var(--text-faint);font-size:12px;padding:20px 0;"
      }, [document.createTextNode("No captured messages for this attempt.")]));
    } else {
      messages.forEach(function (m) { inner.appendChild(bubbleNode(m)); });
    }
    timeline.appendChild(inner);

    main.appendChild(header);
    main.appendChild(timeline);
  }

  function selectAttempt(id) {
    state.activeId = id;
    var a = state.attempts.find(function (x) { return x._id === id; });
    if (!a) return;
    renderTree();
    renderAttempt(a);
  }

  function showEmpty(message) {
    var main = document.getElementById("main");
    main.innerHTML = "";
    main.appendChild(el("div", { id: "empty-state" }, [
      el("div", { class: "big", text: "···" }),
      el("div", { text: message }),
    ]));
  }

  function onAttemptsLoaded(attempts) {
    state.attempts = attempts;
    document.getElementById("sidebar-sub").textContent =
      attempts.length + (attempts.length === 1 ? " attempt" : " attempts");
    renderTree();
    if (attempts.length && !state.activeId) {
      var sorted = attempts.slice().sort(function (a, b) {
        return (b.started_at || "").localeCompare(a.started_at || "");
      });
      selectAttempt(sorted[0]._id);
    } else if (!attempts.length) {
      showEmpty("No transcripts pushed yet. Run export-transcript and push into the attempts collection.");
    }
  }

  async function init() {
    if (!window.claude || typeof window.claude.use !== "function") {
      showEmpty("Live data isn't available in this view.");
      document.getElementById("sidebar-sub").textContent = "unavailable";
      return;
    }
    var claude = null;
    try {
      claude = await window.claude.use("db");
    } catch (e) {
      showEmpty("Could not connect to live data: " + (e && e.message ? e.message : String(e)));
      document.getElementById("sidebar-sub").textContent = "connection failed";
      return;
    }
    if (!claude) {
      showEmpty("Live data isn't available in this view.");
      document.getElementById("sidebar-sub").textContent = "unavailable";
      return;
    }
    claude.collection("attempts").onSnapshot(function (snap) {
      var attempts = snap.docs.map(function (doc) {
        var data = doc.data() || {};
        data._id = doc.id;
        return data;
      });
      onAttemptsLoaded(attempts);
    }, function (err) {
      showEmpty("Could not load transcripts (" + err.code + ": " + err.message + ").");
      document.getElementById("sidebar-sub").textContent = "error: " + err.code;
    });
  }

  init().catch(function (e) {
    showEmpty("init() crashed: " + (e && e.message ? e.message : String(e)));
    document.getElementById("sidebar-sub").textContent = "crashed";
  });
})();
</script>
