global:
  scrape_interval: 30s
  scrape_timeout: 25s
  external_labels:
    environment: production
    monitor: finance-vmagent

scrape_configs:
  - job_name: finance-node
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - finance-node-exporter-prometheus:9100
        labels:
          host: production

  - job_name: finance-process
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - finance-process-exporter:9256
        labels:
          host: production

  - job_name: finance-postgres
    scrape_interval: 60s
    scrape_timeout: 45s
    static_configs:
      - targets:
          - exporter:9187
        labels:
          database_type: timescaledb
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: pg_stat_statements.*
        action: drop

  - job_name: finance-redis
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - redis-singleton-exporter:9121
        labels:
          database_type: redis

  - job_name: finance-kafka
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - finance-kafka-exporter:9308
        labels:
          messaging_type: kafka

  - job_name: finance-mw
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - finance-mw:8002
        labels:
          appname: finance-mw
          deploy_env: production

  - job_name: finance-kline-ingest
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
