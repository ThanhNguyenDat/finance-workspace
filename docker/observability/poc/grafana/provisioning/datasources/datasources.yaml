apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: poc-clickhouse
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: $CLICKHOUSE_USER
      defaultDatabase: observability
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD

  - name: Tempo
    type: tempo
    uid: poc-tempo
    url: http://tempo:3200
    jsonData:
      # trace.id is the join key between the two stores, which is exactly the
      # "CH -. drill-down theo trace.id .-> TEMPO" edge in the spec.
      tracesToLogsV2:
        datasourceUid: poc-clickhouse
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
