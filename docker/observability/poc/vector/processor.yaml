# log-processor (spec: "Log processor").
#
# Consumes observability.logs.raw.v1 as consumer group
# observability-log-processor-v1, enforces the canonical contract, redacts,
# enriches, and publishes to observability.logs.canonical.v1. Anything that
# fails validation goes to observability.logs.dlq.v1 with a bounded, scrubbed
# error description -- never with the secret that triggered the rejection.
#
# Offsets: end-to-end acknowledgements are on, so the Kafka source only commits
# a raw offset after the canonical (or DLQ) produce is acknowledged. That is
# the spec's "chi commit raw offset sau khi Kafka xac nhan canonical event".

data_dir: /var/lib/vector

api:
  enabled: false

sources:
  raw:
    type: kafka
    bootstrap_servers: ${KAFKA_BOOTSTRAP:-kafka:9092}
    group_id: observability-log-processor-v1
    topics: ["observability.logs.raw.v1"]
    auto_offset_reset: earliest
    decoding:
      codec: json
    # Keep Kafka coordinates on the event so a DLQ record can point an operator
    # at the exact topic/partition/offset, as the spec's failure table requires.
    topic_key: kafka_topic
    partition_key: kafka_partition
    offset_key: kafka_offset
    headers_key: kafka_headers

  internal:
    type: internal_metrics
    scrape_interval_secs: 15

transforms:
  to_canonical:
    type: remap
    inputs: [raw]
    # A rejected event must not stall the partition: it is rerouted to the
    # `.dropped` output and published to the DLQ, then the offset advances.
    drop_on_error: true
    drop_on_abort: true
    reroute_dropped: true
    source: |
      # ---- 1. required-field contract -------------------------------------
      # event.id is the producer's idempotency key. It is NEVER regenerated
      # here: a retry that mints a new id would defeat _id-based dedup in
      # Elasticsearch and ReplacingMergeTree dedup in ClickHouse.
      if !exists(.event.id) { abort "missing event.id" }
      if !exists(.event.dataset) { abort "missing event.dataset" }
      if !exists(.message) { abort "missing message" }
      if !exists(.service.name) { abort "missing service.name" }
      if !exists(.service.instance.id) { abort "missing service.instance.id" }

      # ---- 2. timestamp ----------------------------------------------------
      ts = ."@timestamp"
      if is_null(ts) { ts = .timestamp }
      parsed_ts, err = parse_timestamp(to_string(ts) ?? "", "%+")
      if err != null { abort "unparseable @timestamp" }
      # Reject clocks that are implausibly far out rather than letting them
      # silently create future-dated partitions in ClickHouse.
      skew = to_unix_timestamp(parsed_ts) - to_unix_timestamp(now())
      if skew > 3600 { abort "timestamp is more than 1h in the future" }
      ."@timestamp" = format_timestamp!(parsed_ts, format: "%+", timezone: "UTC")
      del(.timestamp)

      # ---- 3. level normalisation -----------------------------------------
      level = downcase(to_string(.log.level) ?? "info")
      level = if level == "warning" { "warn"
      } else if level == "err" { "error"
      } else if level == "critical" || level == "fatal" || level == "panic" { "fatal"
      } else if includes(["trace", "debug", "info", "warn", "error"], level) { level
      } else { "info" }
      .log.level = level

      # ---- 4. deployment identity -----------------------------------------
      .service.environment = to_string(.service.environment) ?? "${DEPLOY_ENV:-development}"
      if !exists(.service.version) { .service.version = "unknown" }
      if !exists(.host.name) && !exists(.k8s.node.name) { .host.name = "unknown" }

      # ---- 5. trace correlation -------------------------------------------
      # W3C ids are 32/16 lowercase hex. An id that is not is a request UUID
      # someone mislabelled; drop it rather than store a broken join key.
      trace_id = downcase(to_string(.trace.id) ?? "")
      if trace_id != "" && !match(trace_id, r'^[0-9a-f]{32}$') {
        del(.trace)
      } else if trace_id != "" {
        .trace.id = trace_id
      }
      span_id = downcase(to_string(.span.id) ?? "")
      if span_id != "" && !match(span_id, r'^[0-9a-f]{16}$') {
        del(.span)
      } else if span_id != "" {
        .span.id = span_id
      }

      # ---- 6. redaction ----------------------------------------------------
      del(.authorization)
      del(.cookie)
      del(.password)
      del(.token)
      del(.api_key)
      del(.secret)
      del(.http.request.headers)
      del(.http.request.body)
      del(.http.response.body)
      # Strip the query string off any URL: the spec forbids logging full URLs
      # with query parameters, and this is where credentials leak in practice.
      if exists(.url.full) {
        .url.full = replace(to_string(.url.full) ?? "", r'\?.*$', "")
      }
      # Last-resort message scrub for inline secrets.
      msg = to_string(.message) ?? ""
      # ORDER MATTERS. The scheme rule must run BEFORE the key=value rule.
      # Run the other way round, `authorization=Bearer <token>` first becomes
      # `authorization=[REDACTED]` -- because `\S+` stops at the space after
      # `Bearer` -- which destroys the `Bearer` keyword the scheme rule needs,
      # and the real token survives into ClickHouse and S3. This was observed,
      # not theorised: 24 rows landed with the token intact before the swap.
      msg = replace(msg, r'(?i)\b(bearer|basic|token)\s+[A-Za-z0-9._~+/=-]{8,}', "$$1 [REDACTED]")
      msg = replace(msg, r'(?i)(authorization|api[_-]?key|password|secret|token)\s*[:=]\s*\S+', "$$1=[REDACTED]")
      .message = msg

      # ---- 7. canonical envelope ------------------------------------------
      .schema.version = "1"
      .event.kind = to_string(.event.kind) ?? "event"
      .event.ingested_at = format_timestamp!(now(), format: "%+", timezone: "UTC")
      .observer.name = "finance-log-processor"
      .observer.type = "vector"

      # Kafka coordinates are transport metadata, not part of the contract.
      del(.observability.parse_ok)
      del(.kafka_topic)
      del(.kafka_partition)
      del(.kafka_offset)
      del(.kafka_headers)
      # Vector's own Kafka source annotations. They are transport detail, not
      # part of the canonical ECS contract, and would otherwise reach
      # Elasticsearch and ClickHouse as unmapped fields.
      del(.message_key)
      del(.source_type)
      del(.metadata)
      .kafka_partition_key = (to_string(.service.name) ?? "unknown") + "/" +
        (to_string(.service.instance.id) ?? "unknown")

  # Rejected events. `.dropped` carries the abort reason under metadata; the
  # payload is re-scrubbed here because a poison event is exactly the kind that
  # carries a secret in an unexpected field.
  to_dlq:
    type: remap
    inputs: [to_canonical.dropped]
    source: |
      # Both halves: `reason` is Vector's category (abort/error) and `message`
      # is the abort text from the validation above. Either one alone has been
      # observed empty, and a DLQ record with no reason is not triageable.
      dropped_reason = to_string(%vector.dropped.reason) ?? ""
      dropped_message = to_string(%vector.dropped.message) ?? ""
      reason = dropped_reason + " " + dropped_message
      if strip_whitespace(reason) == "" { reason = "validation failed" }
      # Bound the reason and strip anything secret-shaped out of it, so the DLQ
      # never becomes the one place a redacted credential is readable.
      reason = replace(reason, r'(?i)\b(bearer|basic|token)\s+[A-Za-z0-9._~+/=-]{8,}', "$$1 [REDACTED]")
      reason = replace(reason, r'(?i)(authorization|api[_-]?key|password|secret|token)\s*[:=]\s*\S+', "$$1=[REDACTED]")
      reason = slice!(reason, 0, 512)

      kafka_topic = to_string(.kafka_topic) ?? "observability.logs.raw.v1"
      kafka_partition = .kafka_partition
      kafka_offset = .kafka_offset

      payload = .
      # Transport metadata is lifted into .kafka below; it does not belong in
      # the archived copy of the offending event.
      del(payload.kafka_topic)
      del(payload.kafka_partition)
      del(payload.kafka_offset)
      del(payload.kafka_headers)
      del(payload.authorization)
      del(payload.cookie)
      del(payload.password)
      del(payload.token)
      del(payload.api_key)
      del(payload.secret)

      # Bounded: a poison event must not be able to blow up the DLQ record too.
      bounded_payload = slice!(encode_json(payload), 0, 8192)

      . = {
        "@timestamp": format_timestamp!(now(), format: "%+", timezone: "UTC"),
        "event": { "dataset": "observability.dlq", "kind": "event" },
        "error": {
          "message": reason,
          "type": to_string(%vector.dropped.component_type) ?? "remap"
        },
        # The exact coordinates an operator needs to find the offending record,
        # which the spec's poison-event row calls for.
        "kafka": {
          "topic": kafka_topic,
          "partition": kafka_partition,
          "offset": kafka_offset
        },
        "payload": bounded_payload
      }

sinks:
  canonical_topic:
    type: kafka
    inputs: [to_canonical]
    bootstrap_servers: ${KAFKA_BOOTSTRAP:-kafka:9092}
    topic: observability.logs.canonical.v1
    key_field: kafka_partition_key
    compression: zstd
    acknowledgements:
      enabled: true
    encoding:
      codec: json
      except_fields: [kafka_partition_key]
    buffer:
      - type: disk
        max_size: 268435488 # Vector's minimum disk-buffer size (256 MiB + 32 B)
        when_full: block

  dlq_topic:
    type: kafka
    inputs: [to_dlq]
    bootstrap_servers: ${KAFKA_BOOTSTRAP:-kafka:9092}
    topic: observability.logs.dlq.v1
    compression: zstd
    acknowledgements:
      enabled: true
    encoding:
      codec: json
    buffer:
      - type: disk
        max_size: 268435488 # Vector's minimum disk-buffer size (256 MiB + 32 B)
        when_full: block

  metrics:
    type: prometheus_exporter
    inputs: [internal]
    address: 0.0.0.0:9598
