# OTel Collector gateway for the POC.
#
# Two changes versus the production otel-collector/config.yaml, both of which
# the spec requires and production currently lacks:
#
#   1. A PERSISTENT sending queue. Production sets `sending_queue.enabled: true`
#      with no `storage:`, which is an in-memory queue -- it is lost on restart.
#      The spec's failure table wants "OTel persistent queue giu span co gioi
#      han" when Tempo is down. During the 2026-08-25 Tempo OOM crash loop that
#      in-memory queue is where the spans went.
#   2. Dual publish to observability.traces.v1 alongside Tempo, so ClickHouse
#      and S3 get raw spans without depending on Tempo retention.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Backs the persistent queue below. The directory must be on a volume that
  # survives container recreation, otherwise the queue is persistent in name
  # only.
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    timeout: 10s
    compaction:
      directory: /var/lib/otelcol/queue
      on_start: true
      on_rebound: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  # Head sampling stays at 100% in the SDK so complete error and slow traces
  # are recoverable; the bounded decision happens here, once, at the gateway.
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: normal-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 100
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 2
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  # Dual publish. Partitioning by trace id keeps a trace's spans in relative
  # order on one partition, which is the spec's trace partition rule and is
  # different from the log rule on purpose.
  kafka/traces:
    brokers: [kafka:9092]
    topic: observability.traces.v1
    encoding: otlp_json
    partition_traces_by_id: true
    producer:
      compression: zstd
      required_acks: -1
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 2
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      # A Tempo outage must not stop the Kafka branch and vice versa: each
      # exporter owns an independent queue and retry budget.
      exporters: [otlp/tempo, kafka/traces]
