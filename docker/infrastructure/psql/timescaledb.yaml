x-container-shared: &container-shared
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - finance
  cpus: "0.5"
  mem_limit: "512M"
  deploy:
    resources:
      limits:
        memory: "512M"
        cpus: "0.5"

networks:
  finance:
    name: finance
    external: true

x-timescaledb-container-shared: &timescaledb-container-shared
  <<: *container-shared
  image: timescale/timescaledb:latest-pg18
  shm_size: 1g
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    POSTGRES_DB: postgres
    TS_TUNE_MEMORY: 4GB
    TS_TUNE_NUM_CPUS: 4
  healthcheck:
    test: 'pg_isready -U ${POSTGRES_USERNAME:-postgres} --dbname=${POSTGRES_DB:-postgres}'
    interval: 10s
    timeout: 5s
    retries: 5
  expose:
    - 5432
  command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]

services:
  timescale:
    <<: *timescaledb-container-shared
    cpus: "1"
    mem_limit: "2G"
    container_name: finance-timescaledb
    hostname: finance-timescaledb
    ports: [ "5432:5432" ]
    volumes:
      - /data/postgres/timescaledb/data:/var/lib/postgresql/data
      - /data/postgres/timescaledb/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    deploy:
      resources:
        limits:
          memory: "2G"
          cpus: "1"

  exporter:
    <<: *container-shared
    image: prometheuscommunity/postgres-exporter
    container_name: finance-timescaledb-exporter
    hostname: finance-timescaledb-exporter
    expose:
      - 9187
    environment:
      DATA_SOURCE_URI: "finance-timescaledb:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
