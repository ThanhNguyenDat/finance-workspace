x-container-shared: &container-shared
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - finance
  cpus: "0.5"
  mem_limit: "512M"
  deploy:
    resources:
      limits:
        memory: "512M"
        cpus: "0.5"

networks:
  finance:
    name: finance
    external: true

services:
  pgbouncer:
    <<: *container-shared
    image: edoburu/pgbouncer:latest
    container_name: finance-pgbouncer
    hostname: finance-pgbouncer
    volumes:
      - /data/postgres/pgbouncer/userlist.txt:/tmp/userlist.txt
      - /data/postgres/pgbouncer/config.ini:/etc/pgbouncer/config.ini
    command: >
      pgbouncer -u postgres /etc/pgbouncer/config.ini
    expose:
      - 6432
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRESQL_DATABASE: mydb
      PGBOUNCER_DATABASE: mydb
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_POOL_MODE: transaction
