schema: spec-driven

context: |
  finance-workspace is the orchestration repository for the Finance ecosystem;
  runtime code remains in finance-mw, finance-web, finance-live-action,
  finance-broker, and mt5. Claude plans and verifies independently; Codex
  implements, tests, and fixes. .agents/rules and .agents/skills are the
  shared Finance source of truth only. Agent-native OpenSpec integrations
  remain separate in each CLI's native directory.

rules:
  proposal:
    - Identify affected repositories, why the change is needed, and non-goals.
    - Describe trading safety impact and rollout/rollback impact when applicable.
  design:
    - Define cross-repository contracts and API/gRPC changes when applicable.
    - Define data/schema migration, retry, timeout, idempotency, failure, and observability semantics when applicable.
  tasks:
    - Identify the owning repository for each implementation task when relevant.
    - Give every task a concrete verification criterion.
    - Separate implementation work from release verification.
