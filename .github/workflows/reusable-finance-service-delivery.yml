name: Finance service delivery template

# Reusable lane for a service that follows the common delivery contract:
# build/test -> immutable image -> Coolify deploy -> production check.
#
# Service repositories keep a small caller workflow and provide their own
# test/deploy/check scripts as inputs.  Research/evidence, rollback and
# infrastructure maintenance workflows remain separate on purpose.
on:
  workflow_call:
    inputs:
      service_name:
        description: Human-readable service name
        required: true
        type: string
      runner_label:
        description: Trusted self-hosted runner label for this service
        required: true
        type: string
      image_name:
        description: Fully-qualified Docker image repository
        required: true
        type: string
      stable_image_tag:
        description: Stable image tag consumed by Coolify
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the caller repository
        required: false
        default: Dockerfile
        type: string
      build_context:
        description: Docker build context relative to the caller repository
        required: false
        default: .
        type: string
      test_command:
        description: Bounded shell command that runs the service test/quality suite
        required: true
        type: string
      deploy_command:
        description: Bounded shell command that deploys the immutable image to Coolify
        required: true
        type: string
      production_check_command:
        description: Bounded shell command that verifies production behavior
        required: true
        type: string
      quality_timeout_minutes:
        description: Maximum quality job duration
        required: false
        default: 30
        type: number
      delivery_timeout_minutes:
        description: Maximum image/deploy job duration
        required: false
        default: 45
        type: number
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      COOLIFY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: ${{ inputs.service_name }} quality
    runs-on: ${{ fromJSON(format('["self-hosted","linux","x64","{0}"]', inputs.runner_label)) }}
    timeout-minutes: ${{ inputs.quality_timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run bounded quality suite
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
          QUALITY_TIMEOUT_MINUTES: ${{ inputs.quality_timeout_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s "${QUALITY_TIMEOUT_MINUTES}m" \
            bash -euo pipefail -c "$TEST_COMMAND"

  image:
    name: ${{ inputs.service_name }} immutable image
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(format('["self-hosted","linux","x64","{0}"]', inputs.runner_label)) }}
    timeout-minutes: ${{ inputs.delivery_timeout_minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            memory=3g
            cpu-period=100000
            cpu-quota=200000

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.stable_image_tag }}
            ${{ inputs.image_name }}:${{ inputs.service_name }}_sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_TIME_UTC=${{ github.run_started_at }}

  deploy:
    name: ${{ inputs.service_name }} deploy
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(format('["self-hosted","linux","x64","{0}"]', inputs.runner_label)) }}
    timeout-minutes: ${{ inputs.delivery_timeout_minutes }}
    concurrency:
      group: finance-production-${{ inputs.service_name }}
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy immutable image
        env:
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.service_name }}_sha-${{ github.sha }}
          DELIVERY_TIMEOUT_MINUTES: ${{ inputs.delivery_timeout_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s "${DELIVERY_TIMEOUT_MINUTES}m" \
            bash -euo pipefail -c "$DEPLOY_COMMAND"

  production-check:
    name: ${{ inputs.service_name }} production check
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(format('["self-hosted","linux","x64","{0}"]', inputs.runner_label)) }}
    timeout-minutes: ${{ inputs.delivery_timeout_minutes }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed revision and behavior
        env:
          PRODUCTION_CHECK_COMMAND: ${{ inputs.production_check_command }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_REF: ${{ inputs.image_name }}:${{ inputs.service_name }}_sha-${{ github.sha }}
          DELIVERY_TIMEOUT_MINUTES: ${{ inputs.delivery_timeout_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s "${DELIVERY_TIMEOUT_MINUTES}m" \
            bash -euo pipefail -c "$PRODUCTION_CHECK_COMMAND"
