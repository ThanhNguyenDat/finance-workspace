name: Agent contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestration:
    name: Orchestration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6.1.0

      - name: Validate shell and JSON
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/orchestrator/bin/ops-runtime.sh
          bash -n tools/orchestrator/bin/quant-research-state.sh
          bash -n tools/orchestrator/bin/detect-codex-availability.sh
          bash -n tools/orchestrator/bin/classify-codex-result.sh
          bash -n tools/orchestrator/bin/run-codex-phase.sh
          bash -n tools/orchestrator/bin/phase-agent-state.sh
          bash -n tools/orchestrator/bin/configure-phase-agents.sh
          bash -n tools/orchestrator/bin/classify-claude-result.sh
          bash -n tools/orchestrator/bin/detect-provider-availability.sh
          bash -n tools/orchestrator/bin/run-claude-phase.sh
          bash -n tools/orchestrator/bin/run-phase-agent.sh
          bash -n tools/orchestrator/bin/run-phase-agent-command.sh
          bash -n tools/orchestrator/bin/run-claude-command.sh
          bash -n tools/orchestrator/bin/sync-agent-links.sh
          bash -n tools/orchestrator/bin/wait-for-phase-attempt.sh
          bash -n tools/orchestrator/bin/watch-phase-attempt-log.sh
          bash -n .agents/scripts/tests/hermetic-env.sh
          bash -n .claude/hooks/ops-stop-hook.sh
          bash -n .agents/scripts/tests/test_ops_orchestration.sh
          bash -n .agents/scripts/tests/test_quant_research_state.sh
          bash -n .agents/scripts/tests/test_codex_availability_detection.sh
          bash -n .agents/scripts/tests/test_quant_research_contract.sh
          bash -n .agents/scripts/tests/test_quant_backend_routing.sh
          bash -n .agents/scripts/tests/test_codex_worker_policy.sh
          bash -n .agents/scripts/tests/test_quant_promotion_trace.sh
          bash -n .agents/scripts/tests/test_phase_agent_state.sh
          bash -n .agents/scripts/tests/test_provider_availability.sh
          bash -n .agents/scripts/tests/test_e2e_entrypoint.sh
          bash -n .agents/scripts/tests/test_phase_agent_routing.sh
          bash -n .agents/scripts/tests/test_phase_agent_quant_launcher.sh
          bash -n .agents/scripts/tests/test_multi_account_routing.sh
          bash -n .agents/scripts/tests/test_claude_quant_launcher.sh
          bash -n .agents/scripts/tests/test_claude_worker_policy.sh
          bash -n .agents/scripts/tests/test_hermetic_agent_contracts.sh
          jq -e . .claude/settings.json >/dev/null

      - name: Run bounded orchestration tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 3m \
            ./.agents/scripts/tests/test_ops_orchestration.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_quant_research_state.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_codex_availability_detection.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_quant_research_contract.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_quant_backend_routing.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_codex_worker_policy.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_quant_promotion_trace.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_phase_agent_state.sh
          timeout --signal=TERM --kill-after=10s 1m \
            ./.agents/scripts/tests/test_provider_availability.sh
          timeout --signal=TERM --kill-after=10s 2m \
            ./.agents/scripts/tests/test_phase_agent_routing.sh
          timeout --signal=TERM --kill-after=10s 2m \
            ./.agents/scripts/tests/test_phase_agent_quant_launcher.sh
          timeout --signal=TERM --kill-after=10s 2m \
            ./.agents/scripts/tests/test_multi_account_routing.sh
          timeout --signal=TERM --kill-after=10s 2m \
            ./.agents/scripts/tests/test_claude_quant_launcher.sh
          timeout --signal=TERM --kill-after=10s 2m \
            ./.agents/scripts/tests/test_claude_worker_policy.sh
          timeout --signal=TERM --kill-after=10s 2m \
            ./.agents/scripts/tests/test_e2e_entrypoint.sh
          timeout --signal=TERM --kill-after=10s 5m \
            ./.agents/scripts/tests/test_hermetic_agent_contracts.sh

      - name: Run bounded Python orchestration tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1m \
            uv run --project tools/orchestrator pytest

      - name: Verify managed links and diff
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1m \
            uv run --project tools/orchestrator sync-agent-links --check
          git diff --check
